<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比例尺實驗室</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="國小六年級數學「比例尺」互動練習：用螢幕上的尺量地圖，算出這張地圖的比例尺。">
<style>
:root{--ink:#1f2d4d;--blue:#2456d6;--pale:#eef3ff;--red:#e0442e;--ok:#17805a;--line:1.5px solid var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;color:var(--ink);background:#fbfbf8;
  background-image:linear-gradient(#dfe6f3 1px,transparent 1px),linear-gradient(90deg,#dfe6f3 1px,transparent 1px);background-size:20px 20px;min-height:100vh;line-height:1.7}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px;border-bottom:var(--line);background:#fbfbf8}
h1{font-size:20px;letter-spacing:.04em}
#prog{font-size:14px;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.mapbox{border:var(--line);background:#fff}
#map{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.panel{display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.steps span{font-size:12.5px;text-align:center;padding:5px 0;border:var(--line);background:#fff;opacity:.55;white-space:nowrap}
.steps span.on{background:var(--blue);color:#fff;opacity:1;font-weight:700}
.steps span.past{opacity:1;background:var(--pale)}
.card{border:var(--line);background:#fff;padding:12px 14px;font-size:16px}
.card .t{display:block;font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.05em}
.card b{color:var(--blue)}
.big{font-size:24px;font-weight:700;white-space:nowrap}
#done{font-size:14px;background:var(--pale)}
#done div::before{content:"✓ ";color:var(--ok);font-weight:700}
input{font:inherit;font-weight:700;width:96px;text-align:center;border:var(--line);background:var(--pale);color:var(--ink);padding:3px 4px;margin:2px 4px;border-radius:0}
input:focus{outline:3px solid #9db8f5}
button{font:inherit;font-weight:700;border:var(--line);background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer;border-radius:0}
button.main{background:var(--blue);color:#fff;flex:1}
button:active{transform:translateY(1px)}
.tools button{font-size:13px;padding:5px 10px}
.btns{display:flex;gap:8px;margin-top:10px}
#msg{margin-top:8px;font-size:14.5px;font-weight:700;color:var(--red);min-height:1.2em}
#msg.ok{color:var(--ok)}
.hint{margin-top:6px;font-size:14.5px;border-left:4px solid var(--blue);background:var(--pale);padding:5px 10px}
.bar{position:relative;width:262px;max-width:100%;height:74px;margin:10px auto 0}
.bar i{position:absolute;top:0;height:12px;width:80px;border:var(--line);background:#fff}
.bar i:nth-child(odd){background:var(--ink)}
.bar .lb{position:absolute;top:18px;width:80px;text-align:center;font-weight:700;font-size:15px}
.bar .lb input{width:64px;margin:0;font-size:15px}
.bar .u{position:absolute;top:50px;left:15px;width:240px;text-align:center;font-size:13px}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;font-weight:700;line-height:1.25;margin:0 4px}
.frac span:first-child{border-bottom:2px solid var(--ink);padding:0 6px}
.say{margin-top:8px;border:1.5px dashed var(--ink);padding:6px 10px;font-size:15px}
.small{font-size:13px;opacity:.8}
#ruler .body{cursor:grab}#ruler .handle{cursor:crosshair}
#ruler,#ruler *{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:8px;gap:8px}
  header{padding:8px 12px}h1{font-size:17px}
  .tools .small{display:none}
  .card{padding:10px 12px}
}
</style>
</head>
<body>
<header><h1>比例尺實驗室</h1><span id="prog"></span></header>
<main>
  <section>
    <div class="mapbox">
      <svg id="map" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-label="小鎮地圖">
        <rect width="800" height="600" fill="#fff"/>
        <ellipse cx="300" cy="235" rx="95" ry="62" fill="#dfeedd"/>
        <ellipse cx="300" cy="545" rx="110" ry="50" fill="#dfeedd"/>
        <ellipse cx="715" cy="110" rx="70" ry="60" fill="#dfeedd"/>
        <path d="M625 -10 C600 100 675 150 625 275 S625 450 575 610" fill="none" stroke="#bcd4f7" stroke-width="30" stroke-linecap="round"/>
        <g id="roads" fill="none" stroke="#c9d3ea" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"></g>
        <g font-size="15" fill="#8a97b5" text-anchor="middle"><text x="40" y="52">北</text><path d="M40 34 V12 M33 20 L40 10 L47 20" stroke="#8a97b5" fill="none" stroke-width="2"/></g>
        <text id="mapno" x="786" y="24" text-anchor="end" font-size="17" fill="#8a97b5"></text>
        <g id="labels"></g>
        <g id="mapbar"></g>
        <g id="ruler">
          <rect class="body" x="-22" y="0" width="694" height="64" rx="3" fill="#ffe066" fill-opacity=".84" stroke="#1f2d4d" stroke-width="2"/>
          <g id="ticks" pointer-events="none"></g>
          <g class="handle" id="handle"><line x1="0" y1="-30" x2="0" y2="-8" stroke="#1f2d4d" stroke-width="2"/><circle r="36" fill="transparent"/><circle r="24" fill="#2456d6" stroke="#fff" stroke-width="3"/>
            <path d="M-10 0a10 10 0 1 1 10 10" stroke="#fff" fill="none" stroke-width="3.5"/><path d="M0 4l-7 6 7 6" stroke="#fff" fill="none" stroke-width="3.5" stroke-linejoin="round"/></g>
        </g>
        <g id="pins" pointer-events="none"></g>
      </svg>
    </div>
    <div class="tools"><button id="reset" type="button">重設尺的位置</button><span class="small">拖曳尺身可以移動，拖曳藍色圓鈕可以旋轉；尺的 0 靠近地點時會自動對齊。</span></div>
  </section>
  <section class="panel">
    <div class="steps" id="steps"></div>
    <div class="card" id="q"></div>
    <div class="card" id="done" hidden></div>
    <div class="card" id="step"></div>
  </section>
</main>
<script>
(function(){
'use strict';
var U=50; // 地圖座標 50 單位 = 圖上 1 公分（尺和地圖用同一套座標，所以任何螢幕都量得一樣）
var PLACES=[{n:'學校',x:2,y:2},{n:'公園',x:6,y:5},{n:'圖書館',x:10,y:2},{n:'車站',x:14,y:5},
            {n:'醫院',x:2,y:8},{n:'超市',x:10,y:8},{n:'郵局',x:14,y:8},{n:'動物園',x:6,y:11}];
var SCALES=[5000,10000,20000,25000,50000];
var STEP_NAMES=['量一量','換單位','寫比例尺','畫比例尺'];
var $=function(s){return document.querySelector(s)};
var NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;parent.appendChild(e);return e}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)]}

// 只出「圖上距離剛好是整數公分」的地點組合
var PAIRS=[];
PLACES.forEach(function(a,i){PLACES.forEach(function(b,j){if(i<j){var d=dist(a,b);if(Math.abs(d-Math.round(d))<1e-9)PAIRS.push([a,b,Math.round(d)])}})});

// ---------- 畫地圖 ----------
PAIRS.forEach(function(p){el('line',{x1:p[0].x*U,y1:p[0].y*U,x2:p[1].x*U,y2:p[1].y*U},$('#roads'))});
PLACES.forEach(function(p){
  el('text',{x:p.x*U,y:p.y*U-17,'font-size':21,'font-weight':700,'text-anchor':'middle',fill:'#1f2d4d',stroke:'#fff','stroke-width':5,'paint-order':'stroke'},$('#labels'),p.n);
  p.pin=el('circle',{cx:p.x*U,cy:p.y*U,r:8,fill:'#1f2d4d',stroke:'#fff','stroke-width':2.5},$('#pins'));
});
(function(){var g=$('#ticks');for(var i=0;i<=130;i++){var x=i*U/10,h=i%10===0?27:i%5===0?19:12;
  el('line',{x1:x,y1:0,x2:x,y2:h,stroke:'#1f2d4d','stroke-width':i%10===0?2:1.1},g);
  if(i%10===0)el('text',{x:x,y:50,'font-size':21,'font-weight':700,'text-anchor':'middle',fill:'#1f2d4d'},g,i/10)}
  el('text',{x:-11,y:60,'font-size':12,fill:'#1f2d4d','text-anchor':'middle'},g,'cm')})();

// ---------- 尺 ----------
var svg=$('#map'),rulerEl=$('#ruler'),R={x:60,y:470,a:0},HY=94,HT=640,drag=null;
function placeHandle(){ // 旋轉鈕永遠留在地圖範圍內，才抓得到
  var c=Math.cos(R.a),s=Math.sin(R.a),t;
  for(t=640;t>100;t-=10){var hx=R.x+t*c-HY*s,hy=R.y+t*s+HY*c;if(hx>30&&hx<770&&hy>30&&hy<570)break}
  HT=t;$('#handle').setAttribute('transform','translate('+t+','+HY+')')}
function drawRuler(){if(!drag||drag.mode!=='rot')placeHandle();rulerEl.setAttribute('transform','translate('+R.x+','+R.y+') rotate('+(R.a*180/Math.PI)+')')}
function resetRuler(){R={x:60,y:470,a:0};drawRuler()}
function pt(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function snapAngle(tol){var best=null;PLACES.forEach(function(p){var dx=p.x*U-R.x,dy=p.y*U-R.y;if(Math.hypot(dx,dy)<20)return;
  var a=Math.atan2(dy,dx),diff=Math.atan2(Math.sin(R.a-a),Math.cos(R.a-a));if(Math.abs(diff)<tol&&(!best||Math.abs(diff)<best.d))best={a:a,d:Math.abs(diff)}});
  if(best)R.a=best.a}
function down(mode){return function(e){e.preventDefault();var p=pt(e);drag={mode:mode,ox:p.x-R.x,oy:p.y-R.y};e.currentTarget.setPointerCapture(e.pointerId)}}
function move(e){if(!drag)return;var p=pt(e);
  if(drag.mode==='move'){R.x=Math.max(0,Math.min(800,p.x-drag.ox));R.y=Math.max(0,Math.min(600,p.y-drag.oy))}
  else{R.a=Math.atan2(p.y-R.y,p.x-R.x)-Math.atan2(HY,HT);snapAngle(0.035)}
  drawRuler()}
function up(){if(!drag)return;
  if(drag.mode==='move'){var near=null;PLACES.forEach(function(p){var d=Math.hypot(p.x*U-R.x,p.y*U-R.y);if(d<32&&(!near||d<near.d))near={p:p,d:d}});
    if(near){R.x=near.p.x*U;R.y=near.p.y*U;snapAngle(0.035)}}
  drag=null;drawRuler()}
var bodyEl=rulerEl.querySelector('.body'),handleEl=rulerEl.querySelector('.handle');
bodyEl.addEventListener('pointerdown',down('move'));handleEl.addEventListener('pointerdown',down('rot'));
[bodyEl,handleEl].forEach(function(t){t.addEventListener('pointermove',move);t.addEventListener('pointerup',up);t.addEventListener('pointercancel',up)});
// 手機：手指放在尺上時不要捲動網頁（部分手機瀏覽器不理會 SVG 內的 touch-action，所以直接攔下觸控事件）
['touchstart','touchmove'].forEach(function(t){rulerEl.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
document.addEventListener('touchmove',function(e){if(drag)e.preventDefault()},{passive:false});
$('#reset').addEventListener('click',resetRuler);

// ---------- 題目 ----------
var Q=null,step=0,wrong=0,hintN=0,solved=0,mapNo=0,last={};
function realText(){return (Q.scale===50000?(Q.realM/1000)+' 公里':Q.realM+' 公尺')}
function newQuestion(){
  var pair,scale;
  do{pair=rnd(PAIRS)}while(last.pair===pair);
  do{scale=rnd(mapNo===0?[10000,20000]:SCALES)}while(last.scale===scale);
  last={pair:pair,scale:scale};mapNo++;
  var flip=Math.random()<.5;
  Q={A:pair[flip?1:0],B:pair[flip?0:1],d:pair[2],scale:scale,realM:pair[2]*scale/100,realCm:pair[2]*scale,per:scale/100};
  step=0;wrong=0;hintN=0;
  PLACES.forEach(function(p){var on=p===Q.A||p===Q.B;p.pin.setAttribute('r',on?11:8);p.pin.setAttribute('fill',on?'#e0442e':'#1f2d4d')});
  $('#mapbar').innerHTML='';$('#mapno').textContent='第 '+mapNo+' 張地圖';
  resetRuler();render();
}
function inp(id){return '<input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" aria-label="填入答案">'}
function barHTML(labels){var h='<div class="bar"><i style="left:15px"></i><i style="left:95px"></i><i style="left:175px"></i>';
  labels.forEach(function(l,k){h+='<span class="lb" style="left:'+(k*80-25)+'px">'+l+'</span>'});return h+'<span class="u">（單位：公尺）</span></div>'}
function frac(){return '<span class="frac"><span>1</span><span>'+Q.scale+'</span></span>'}

var STEPS=[
 {html:function(){return '用尺量量看，<b>'+Q.A.n+'</b>到<b>'+Q.B.n+'</b>在地圖上的距離是'+inp('a0')+'公分'},
  ans:function(){return [Q.d]},tol:0.1,
  hints:function(){return ['把尺的 0 對準其中一個地點，再拖曳藍色圓鈕旋轉，讓尺的邊緣通過另一個地點。','看看另一個地點對到尺上的哪一個刻度，那就是圖上距離。']},
  done:function(){return '圖上距離：'+Q.d+' 公分'}},
 {html:function(){return '比例尺的單位要一樣才能比。<br>實際距離 '+realText()+' ='+inp('a0')+'公分'},
  ans:function(){return [Q.realCm]},tol:0,
  hints:function(){return Q.scale===50000?['1 公里 = 1000 公尺，1 公尺 = 100 公分。',(Q.realM/1000)+' 公里 = '+Q.realM+' 公尺，'+Q.realM+' × 100 = ？']:['1 公尺 = 100 公分，所以要乘以 100。',Q.realM+' × 100 = ？']},
  done:function(){return '實際距離：'+realText()+' = '+Q.realCm+' 公分'}},
 {html:function(){return '圖上距離 : 實際距離<br>= '+Q.d+' 公分 : '+Q.realCm+' 公分<br>= 1 :'+inp('a0')},
  ans:function(){return [Q.scale]},tol:0,
  feedback:function(v){if(v[0]===Q.realM/Q.d||v[0]===Q.realM)return '單位要一樣才能比，記得用「公分 : 公分」來算。'},
  hints:function(){return ['把比的前項和後項同時除以 '+Q.d+'，讓前項變成 1。',Q.realCm+' ÷ '+Q.d+' = ？']},
  done:function(){return '比例尺：1 : '+Q.scale+'，也可以寫成 '+frac()}},
 {html:function(){return '最後，畫出這張地圖的<b>圖示比例尺</b>。下面每一格是圖上 1 公分，請填入各個刻度代表的實際距離。'+barHTML(['0',inp('a0'),inp('a1'),inp('a2')])},
  ans:function(){return [Q.per,Q.per*2,Q.per*3]},tol:0,
  feedback:function(v){if(v[0]===Q.scale)return Q.scale+' 的單位是公分，換成公尺是多少呢？'},
  hints:function(){return ['比例尺 1 : '+Q.scale+' 表示圖上 1 公分代表實際 '+Q.scale+' 公分。',Q.scale+' 公分 = '+Q.scale+' ÷ 100 公尺；第二格是它的 2 倍，第三格是 3 倍。']},
  done:function(){return ''}}
];

function render(){
  $('#prog').textContent='已完成 '+solved+' 題';
  $('#steps').innerHTML=STEP_NAMES.map(function(n,i){return '<span class="'+(i===step?'on':i<step?'past':'')+'">'+(i+1)+' '+n+'</span>'}).join('');
  $('#q').innerHTML='<span class="t">第 '+mapNo+' 題</span>從 <b>'+Q.A.n+'</b> 到 <b>'+Q.B.n+'</b> 的實際距離是 <span class="big">'+realText()+'</span>';
  var d=$('#done');d.hidden=step===0||step>3;
  d.innerHTML=STEPS.slice(0,Math.min(step,3)).map(function(s){return '<div>'+s.done()+'</div>'}).join('');
  var c=$('#step');
  if(step>3){
    c.innerHTML='<span class="t">完成！這張地圖的比例尺</span><div><span class="big">1 : '+Q.scale+'</span>　或　'+frac()+'</div>'+barHTML(['0',Q.per,Q.per*2,Q.per*3])+
      '<div class="say">我的比例尺是 1 : '+Q.scale+'，意思是圖上 1 公分代表實際 '+Q.per+' 公尺。</div>'+
      '<div class="small" style="margin-top:6px">把這個畫面截圖，貼到 Padlet 的「成果分享」吧！地圖右下角也畫上你的比例尺了。</div>'+
      '<div class="btns"><button class="main" id="next" type="button">換一張地圖，再挑戰一題</button></div>';
    $('#next').addEventListener('click',newQuestion);return;
  }
  var s=STEPS[step];
  c.innerHTML='<span class="t">步驟 '+(step+1)+'　'+STEP_NAMES[step]+'</span>'+s.html()+'<div id="msg" role="status"></div><div id="hints"></div>'+
    '<div class="btns"><button id="hint" type="button">提示</button><button class="main" id="check" type="button">檢查答案</button></div>';
  $('#check').addEventListener('click',check);$('#hint').addEventListener('click',showHint);
  c.querySelectorAll('input').forEach(function(i){i.addEventListener('keydown',function(e){if(e.key==='Enter')check()})});
}
function num(s){s=s.replace(/[０-９．]/g,function(ch){return String.fromCharCode(ch.charCodeAt(0)-65248)}).replace(/[,，\s]/g,'');return s===''?NaN:Number(s)}
function showHint(){var h=STEPS[step].hints();if(hintN>=h.length)return;var div=document.createElement('div');div.className='hint';div.textContent='提示 '+(hintN+1)+'：'+h[hintN];$('#hints').appendChild(div);hintN++;
  if(hintN>=h.length)$('#hint').disabled=true}
function check(){
  var s=STEPS[step],ans=s.ans(),vals=ans.map(function(_,i){return num($('#a'+i).value)}),msg=$('#msg');
  msg.className='';
  if(vals.some(isNaN)){msg.textContent='請先填入數字喔。';return}
  if(vals.every(function(v,i){return Math.abs(v-ans[i])<=s.tol+1e-9})){step++;wrong=0;hintN=0;if(step>3){solved++;drawMapBar()}render();return}
  wrong++;msg.textContent=(s.feedback&&s.feedback(vals))||'不太對，再試一次！';
  if(wrong>=2)showHint();
}
function drawMapBar(){var g=$('#mapbar'),x=596,y=556;g.innerHTML='';
  el('rect',{x:x-34,y:y-12,width:236,height:52,fill:'#fff','fill-opacity':.92,stroke:'#1f2d4d','stroke-width':1.5},g);
  for(var k=0;k<3;k++)el('rect',{x:x+k*U,y:y,width:U,height:9,fill:k%2?'#fff':'#1f2d4d',stroke:'#1f2d4d','stroke-width':1.5},g);
  for(k=0;k<4;k++)el('text',{x:x+k*U,y:y+30,'font-size':15,'font-weight':700,'text-anchor':'middle',fill:'#1f2d4d'},g,k*Q.per);
  el('text',{x:x+3*U+8,y:y+10,'font-size':14,fill:'#1f2d4d'},g,'公尺')}

newQuestion();
})();
</script>
</body>
</html>
